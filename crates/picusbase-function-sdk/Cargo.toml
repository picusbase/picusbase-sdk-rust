[package]
name = "picusbase-function-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SDK for writing native (native-v1) PicusBase Compute Functions in Rust"
repository = "https://github.com/picusbase/picusbase-sdk-rust"
homepage = "https://github.com/picusbase/picusbase-sdk-rust"
readme = "README.md"
keywords = ["picusbase", "functions", "serverless", "sdk"]
categories = ["api-bindings", "web-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

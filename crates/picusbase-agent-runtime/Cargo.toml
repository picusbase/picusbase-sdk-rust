[package]
name = "picusbase-agent-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Orchestration core of the AI assistant, shared by every app on PicusBase"
repository = "https://github.com/picusbase/picusbase-sdk-rust"
homepage = "https://github.com/picusbase/picusbase-sdk-rust"
readme = "README.md"
keywords = ["picusbase", "ai", "agent", "functions"]
categories = ["api-bindings"]

[dependencies]
picusbase-function-sdk = { version = "0.1.0", path = "../picusbase-function-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

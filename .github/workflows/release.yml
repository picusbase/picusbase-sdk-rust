name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Tag matches both crate versions
        run: |
          want="${GITHUB_REF_NAME#v}"
          for manifest in crates/picusbase-errors/Cargo.toml crates/picusbase-sdk/Cargo.toml; do
            got=$(grep -m1 '^version' "$manifest" | cut -d'"' -f2)
            test "$got" = "$want" || { echo "$manifest is $got, tag is $want"; exit 1; }
          done
      - run: cargo check --workspace --all-targets
      - run: cargo check -p picusbase-sdk --target wasm32-unknown-unknown
      - name: Dry-run picusbase-errors (picusbase-sdk needs it on crates.io first)
        run: cargo publish -p picusbase-errors --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish picusbase-errors
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p picusbase-errors
      - name: Publish picusbase-sdk once the index has picusbase-errors
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            cargo publish -p picusbase-sdk && exit 0
            echo "retrying in 30s (attempt $attempt)"; sleep 30
          done
          exit 1
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
